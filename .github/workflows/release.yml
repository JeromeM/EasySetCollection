name: Release

# Publishes ONLY on main (i.e. when a PR from develop is merged), and only when
# the addon version (## Version in the .toc) is new (no matching git tag yet).
# A doc-only merge with the same version does nothing.
#
# The zip is built by scripts/package.sh — the exact same artifact you get
# locally (generator stripped, data baked in) — then uploaded to CurseForge and
# attached to a GitHub Release tagged vX.Y.Z.
#
# Required repo config (Settings -> Secrets and variables -> Actions), all as
# SECRETS (each platform's upload is skipped while its pair is missing):
#   CF_API_KEY                        CurseForge API token
#   WAGO_API_TOKEN + WAGO_PROJECT_ID  Wago Addons token + project id/slug
#   WOWI_API_TOKEN + WOWI_ADDON_ID    WoWInterface token + addon id
#   Variables: GAME_VERSIONS (optional, overrides the default list below)
# and Settings -> Actions -> Workflow permissions: "Read and write".
# A MANUAL run (workflow_dispatch) re-uploads the CURRENT version to Wago and
# WoWInterface only — CurseForge and the GitHub release stay guarded by the
# tag — the repair lever when those credentials arrive after a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create tags + GitHub releases

env:
  CF_PROJECT_ID: "1642958"   # CurseForge project id (About This Project page)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WAGO_PROJECT_ID: ${{ secrets.WAGO_PROJECT_ID }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WOWI_ADDON_ID: ${{ secrets.WOWI_ADDON_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # need history + tags to detect an already-released version
          fetch-tags: true

      - name: Resolve version + game patch
        id: meta
        run: |
          git fetch --tags --force --quiet || true   # make sure existing tags are visible
          toc=EasySetCollection/EasySetCollection.toc
          v=$(grep -m1 '## Version:'   "$toc" | sed 's/.*:[[:space:]]*//' | tr -d '\r')
          iface=$(grep -m1 '## Interface:' "$toc" | sed 's/.*:[[:space:]]*//' | tr -d '\r')
          patch="$((10#$iface/10000)).$((10#$iface/100%100)).$((10#$iface%100))"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"
          # supported game versions (override with the GAME_VERSIONS repo variable)
          versions="${{ vars.GAME_VERSIONS }}"
          [ -n "$versions" ] || versions="12.0.1,12.0.5,12.0.7,12.1.0"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$v" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "Version v$v already tagged — nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.meta.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          bash scripts/package.sh
          echo "ZIP=EasySetCollection-${{ steps.meta.outputs.version }}.zip" >> "$GITHUB_ENV"

      - name: Extract changelog notes
        id: notes
        if: steps.meta.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          awk -v v="${{ steps.meta.outputs.version }}" '
            $0 ~ ("^## \\[" v "\\]") {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "EasySetCollection ${{ steps.meta.outputs.version }}" > RELEASE_NOTES.md
          {
            echo "body<<EOF"
            cat RELEASE_NOTES.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge
        if: steps.meta.outputs.exists == 'false' && env.CF_API_KEY != '' && env.CF_PROJECT_ID != ''
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CF_API_KEY }}
          project_id: ${{ env.CF_PROJECT_ID }}
          game_endpoint: wow
          file_path: ${{ env.ZIP }}
          game_versions: ${{ steps.meta.outputs.versions }}
          release_type: release
          display_name: EasySetCollection ${{ steps.meta.outputs.version }}
          changelog: ${{ steps.notes.outputs.body }}
          changelog_type: markdown

      - name: Upload to Wago Addons
        if: (steps.meta.outputs.exists == 'false' || github.event_name == 'workflow_dispatch') && env.WAGO_API_TOKEN != '' && env.WAGO_PROJECT_ID != ''
        run: |
          # Wago wants ONE supported patch per flavor — take the newest of the list.
          patch="${{ steps.meta.outputs.versions }}"
          patch="${patch##*,}"
          # metadata goes through a FILE: curl -F parses inline values (quotes,
          # semicolons — both live in changelog prose) and truncates the JSON
          jq -n -c \
            --arg label "${{ steps.meta.outputs.version }}" \
            --arg patch "$patch" \
            --rawfile changelog RELEASE_NOTES.md \
            '{label: $label, stability: "stable", supported_retail_patch: $patch, changelog: $changelog}' \
            > wago-metadata.json
          curl -sS --fail-with-body --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $WAGO_API_TOKEN" \
            -H "Accept: application/json" \
            -F "metadata=<wago-metadata.json" \
            -F "file=@$ZIP" \
            "https://addons.wago.io/api/projects/$WAGO_PROJECT_ID/version"

      - name: Upload to WoWInterface
        if: (steps.meta.outputs.exists == 'false' || github.event_name == 'workflow_dispatch') && env.WOWI_API_TOKEN != '' && env.WOWI_ADDON_ID != ''
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 10 \
            -H "x-api-token: $WOWI_API_TOKEN" \
            -F "id=$WOWI_ADDON_ID" \
            -F "version=${{ steps.meta.outputs.version }}" \
            -F "compatible=${{ steps.meta.outputs.versions }}" \
            -F "changelog=<RELEASE_NOTES.md" \
            -F "archive=No" \
            -F "updatefile=@$ZIP" \
            "https://api.wowinterface.com/addons/update"

      - name: GitHub Release (tag vX.Y.Z)
        if: steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: EasySetCollection ${{ steps.meta.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.ZIP }}
